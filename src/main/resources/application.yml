spring:
  application:
    name: customer-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15434/customer}
    username: ${SPRING_DATASOURCE_USERNAME:dbadmin}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

# O Customer valida o token; a emissão é da Lambda de auth.
# Senha que substitui a padrão (admin123) do admin semeado pela migration V2.
# Só é aplicada enquanto o admin ainda usa a padrão. Sem ela (ou com menos de 8
# caracteres), o serviço NÃO sobe — exceto no perfil local (application-local.yml).
admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD:}
  initial-password-required: true

jwt:
  # Chave PÚBLICA da Lambda de autenticação (RS256), Base64 do DER. Sem padrão: sem ela não sobe.
  public-key: ${JWT_PUBLIC_KEY}
  # Chave pública do token de serviço do os-service (só o customer aceita esse token).
  service-public-key: ${JWT_SERVICE_PUBLIC_KEY}

logging:
  file:
    name: /tmp/app.log
  level:
    root: INFO

management:
  metrics:
    tags:
      service: ${DD_SERVICE:${spring.application.name}}
      env: ${DD_ENV:local}
      version: ${DD_VERSION:local}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  datadog:
    metrics:
      export:
        enabled: ${DD_METRICS_ENABLED:false}
        api-key: ${DD_API_KEY:}
        uri: ${DD_METRICS_URI:https://api.datadoghq.com}
        step: 1m

server:
  port: 8080

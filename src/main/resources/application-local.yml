# Perfil local (IDE e docker compose): valores de DESENVOLVIMENTO.
# Fora dele não há valor padrão: sem JWT_SECRET, SPRING_DATASOURCE_PASSWORD ou ADMIN_INITIAL_PASSWORD o serviço não sobe.
# Ative com SPRING_PROFILES_ACTIVE=local (o compose do workbench-messaging já ativa).
spring:
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:senha-super-segura}

# Par de chaves de DESENVOLVIMENTO (público no repositório; nunca usar na AWS).
jwt:
  public-key: ${JWT_PUBLIC_KEY:}
  service-public-key: ${JWT_SERVICE_PUBLIC_KEY:}

# Localmente o admin semeado pode continuar com a senha padrão (admin123).
admin:
  initial-password-required: false
